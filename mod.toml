# RecompModTool manifest. Rename the mod by changing id, display_name and mod_filename together (id must be a C identifier).
[manifest]
id = "my_mod"
version = "1.0.0"
display_name = "My Mod"
description = "An example Rogue Squadron 64 Recompiled code mod."
short_description = "An example code mod."
authors = ["you"]
game_id = "rs64"
minimum_recomp_version = "0.0.0"
enabled_by_default = true

# Options appear under the mod in the game's Mods panel (F1); read them with recomp_get_config_u32 / _double / _string (recompconfig.h).
# type is "Enum" (options, default; the value read is the option's index), "Number" (min, max, step, precision, percent, default) or "String" (default).
[[manifest.config_options]]
id = "announce"
name = "Announce missions"
description = "Print a line to the game's console when a mission starts and ends."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "my_mod"
func_reference_syms_file = "syms/rogue_squadron.syms.toml"
data_reference_syms_files = [ "syms/rogue_squadron.datasyms.toml" ]
# Packed into the .nrm next to the code: the menu page (roguesq_menu.json). Add "instruction_patches.json" here to ship instruction patches.
additional_files = [ "roguesq_menu.json" ]
